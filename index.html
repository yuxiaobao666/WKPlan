        function removeSpecialDate(date) {
            if (!confirm(`确认移除 ${date} 的特殊标记？`)) return;
            data.specialDates = data.specialDates.filter(d => d.date !== date);
            saveData();
            closeModal();
            showToast('已移除');
            openSpecialDateManager();
            renderCalendar();
        }

        // ============================================================
        //  日历
        // ============================================================
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('calendarMonthLabel');
            label.textContent = `${calendarYear}年${calendarMonth + 1}月`;

            const firstDayOfMonth = new Date(calendarYear, calendarMonth, 1).getDay();
            const startOffset = (firstDayOfMonth === 0) ? 6 : firstDayOfMonth - 1;
            const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const today = todayStr();

            let html = '';
            const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
            weekdays.forEach(w => { html += `<div class="weekday">${w}</div>`; });

            for (let i = 0; i < startOffset; i++) {
                html += `<div class="day-cell empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr =
                    `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayType = getDayType(dateStr);
                const isHoliday = dayType === 'holiday';
                const isWorkdayOnRest = dayType === 'workday' && (new Date(dateStr + 'T00:00:00').getDay() === 0 || new Date(
                    dateStr + 'T00:00:00').getDay() === 6);

                const cellClass = isHoliday ? 'restday' : 'workday';
                const dayNumberClass = isToday ? 'today' : (isHoliday ? 'holiday' : (isWorkdayOnRest ? 'workday-on-rest' :
                ''));

                const recordsOnDay = data.records.filter(r => r.date === dateStr);
                const todosOnDay = data.todos.filter(t => t.dueDate === dateStr);
                const doneCount = recordsOnDay.length;
                const todoCount = todosOnDay.length;
                let statsHtml = '';
                if (doneCount > 0) statsHtml += `<div class="stat-record">📝 ${doneCount}</div>`;
                if (todoCount > 0) statsHtml += `<div class="stat-todo">⏳ ${todoCount}</div>`;
                if (isHoliday) statsHtml += `<div class="stat-holiday">🎉 节假日</div>`;
                if (isWorkdayOnRest) statsHtml += `<div class="stat-workday-on-rest">🏢 调休上班</div>`;

                html += `
                    <div class="day-cell ${cellClass}" onclick="openDayDetail('${dateStr}')">
                        <div class="day-number ${dayNumberClass}">${day}</div>
                        <div class="day-stats">${statsHtml}</div>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        function changeMonth(delta) {
            calendarMonth += delta;
            if (calendarMonth < 0) { calendarMonth = 11;
                calendarYear--; }
            if (calendarMonth > 11) { calendarMonth = 0;
                calendarYear++; }
            renderCalendar();
        }

        function goToday() {
            const now = new Date();
            calendarYear = now.getFullYear();
            calendarMonth = now.getMonth();
            renderCalendar();
        }

        function openDayDetail(dateStr) {
            const records = data.records.filter(r => r.date === dateStr);
            const todos = data.todos.filter(t => t.dueDate === dateStr);
            const dayType = getDayType(dateStr);
            const typeLabel = dayType === 'holiday' ? '🎉 节假日' : '🏢 工作日';

            const existingSpecial = isSpecialDate(dateStr);
            let specialActionsHtml = '';
            if (existingSpecial) {
                specialActionsHtml = `
                    <button class="btn-outline btn-sm" onclick="removeSpecialDateFromCalendar('${dateStr}')" style="color:#ef4444;">移除特殊标记</button>
                `;
            } else {
                specialActionsHtml = `
                    <button class="btn-outline btn-sm" onclick="addSpecialDateFromCalendar('${dateStr}', 'holiday')">🎉 设为节假日</button>
                    <button class="btn-outline btn-sm" onclick="addSpecialDateFromCalendar('${dateStr}', 'workday')">🏢 设为调休工作日</button>
                `;
            }

            let recordsHtml = '';
            if (records.length === 0) {
                recordsHtml = `<div class="day-detail-empty">📭 当天没有工作记录</div>`;
            } else {
                recordsHtml = records.map(r => `
                    <div class="day-detail-item">
                        <span><span class="detail-type" style="background:${getTypeColor(r.type)}20; color:${getTypeColor(r.type)};">${getTypeLabel(r.type)}</span> ${escapeHtml(r.event)}${r.detail ? ' <span class="detail-detail">· ' + escapeHtml(r.detail) + '</span>' : ''}</span>
                        <span class="detail-hours">${(parseFloat(r.hours)||0).toFixed(2)}h</span>
                    </div>
                `).join('');
            }

            let todosHtml = '';
            if (todos.length === 0) {
                todosHtml = `<div class="day-detail-empty">✅ 当天没有待办</div>`;
            } else {
                todosHtml = todos.map(t => `
                    <div class="day-detail-item todo-item-detail">
                        <span><span class="detail-type" style="background:${getTypeColor(t.type)}20; color:${getTypeColor(t.type)};">${getTypeLabel(t.type)}</span> ${escapeHtml(t.event)}</span>
                        <span style="font-size:11px;color:#94a3b8;">⏳ 待办</span>
                    </div>
                `).join('');
            }

            const displayDate = formatDate(dateStr);
            showModal(`
                <h3>📅 ${displayDate} · ${typeLabel}</h3>
                <div class="sub">工作记录 & 待办</div>
                <div style="margin-bottom:10px;">
                    <div style="font-weight:500;font-size:13px;color:#6366f1;margin-bottom:4px;">📝 工作记录 (${records.length})</div>
                    <div class="day-detail-list">${recordsHtml}</div>
                </div>
                <div>
                    <div style="font-weight:500;font-size:13px;color:#f59e0b;margin-bottom:4px;">⏳ 待办 (${todos.length})</div>
                    <div class="day-detail-list">${todosHtml}</div>
                </div>
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid #eef2f6;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
                    ${specialActionsHtml}
                </div>
                <div class="modal-actions">
                    <button class="btn-outline" onclick="closeModal()">关闭</button>
                </div>
            `);
        }

        // ============================================================
        //  ★★★ 统计页面 ★★★
        // ============================================================
        let statsChartPie = null;
        let statsChartBar = null;
        let statsCurrentPeriod = 'week';

        function initStatsPage() {
            // 设置默认日期范围
            setStatsPeriod('week');
            updateStats();
        }

        function setStatsPeriod(period) {
            statsCurrentPeriod = period;
            // 更新按钮状态
            document.querySelectorAll('#statsPeriodGroup button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.period === period);
            });

            const today = todayStr();
            const startInput = document.getElementById('statsDateStart');
            const endInput = document.getElementById('statsDateEnd');

            if (period === 'week') {
                // 本周：周一 ~ 周日
                const d = new Date();
                const day = d.getDay();
                const diff = (day === 0 ? 6 : day - 1);
                const monday = new Date(d);
                monday.setDate(d.getDate() - diff);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                startInput.value = monday.toISOString().slice(0, 10);
                endInput.value = sunday.toISOString().slice(0, 10);
            } else if (period === 'month') {
                // 本月：1号 ~ 今天
                const d = new Date();
                const firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
                startInput.value = firstDay.toISOString().slice(0, 10);
                endInput.value = today;
            } else {
                // custom: 保留用户已选的值，如果没有则设为今天
                if (!startInput.value) startInput.value = today;
                if (!endInput.value) endInput.value = today;
            }
            updateStats();
        }

        function updateStats() {
            const start = document.getElementById('statsDateStart').value;
            const end = document.getElementById('statsDateEnd').value;
            if (!start || !end) {
                showToast('请选择完整的日期范围');
                return;
            }
            if (start > end) {
                showToast('开始日期不能晚于结束日期');
                return;
            }

            // 筛选记录
            const filtered = data.records.filter(r => r.date >= start && r.date <= end);
            const countEl = document.getElementById('statsRecordCount');
            countEl.textContent = `${filtered.length} 条记录`;

            const emptyEl = document.getElementById('statsEmpty');
            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                document.getElementById('statsCards').style.display = 'none';
                document.querySelector('.charts-grid').style.display = 'none';
                return;
            }
            emptyEl.classList.add('hidden');
            document.getElementById('statsCards').style.display = 'grid';
            document.querySelector('.charts-grid').style.display = 'grid';

            // ---- 总览卡片 ----
            const totalHours = filtered.reduce((sum, r) => sum + (parseFloat(r.hours) || 0), 0);
            document.getElementById('statsTotal').innerHTML = totalHours.toFixed(2) + '<span class="unit">h</span>';

            // 日均工时（按实际有记录的天数算）
            const daysSet = new Set(filtered.map(r => r.date));
            const daysCount = daysSet.size;
            const dailyAvg = daysCount > 0 ? totalHours / daysCount : 0;
            document.getElementById('statsDaily').innerHTML = dailyAvg.toFixed(2) + '<span class="unit">h</span>';

            // 最耗时类型
            const typeMap = {};
            filtered.forEach(r => {
                const t = r.type || '其他';
                typeMap[t] = (typeMap[t] || 0) + (parseFloat(r.hours) || 0);
            });
            let topType = '-';
            let topHours = 0;
            for (const [t, h] of Object.entries(typeMap)) {
                if (h > topHours) {
                    topHours = h;
                    topType = t;
                }
            }
            document.getElementById('statsTopType').textContent = topType;
            document.getElementById('statsTopTypeHours').textContent = topHours > 0 ? `${topHours.toFixed(2)}h` : '';

            // ---- 更新图表 ----
            renderPieChart(filtered);
            renderBarChart(filtered, start, end);
        }

        function renderPieChart(filtered) {
            const ctx = document.getElementById('pieChart').getContext('2d');

            // 按类型汇总
            const typeMap = {};
            filtered.forEach(r => {
                const t = r.type || '其他';
                typeMap[t] = (typeMap[t] || 0) + (parseFloat(r.hours) || 0);
            });

            const labels = Object.keys(typeMap);
            const values = Object.values(typeMap);
            const colors = labels.map(t => getTypeColor(t));

            if (statsChartPie) {
                statsChartPie.destroy();
            }

            statsChartPie = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.map(l => `${l} (${getTypeLabel(l)})`),
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderColor: '#ffffff',
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 11 },
                                padding: 10,
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = total > 0 ? ((context.parsed / total) * 100).toFixed(1) : 0;
                                    return `${context.label}: ${context.parsed.toFixed(2)}h (${percentage}%)`;
                                }
                            }
                        }
                    },
                    cutout: '60%',
                }
            });
        }

        function renderBarChart(filtered, start, end) {
            const ctx = document.getElementById('barChart').getContext('2d');

            // 按天汇总
            const dayMap = {};
            const allDays = [];
            let current = start;
            while (current <= end) {
                allDays.push(current);
                dayMap[current] = 0;
                current = getDateOffset(current, 1);
            }

            filtered.forEach(r => {
                if (dayMap[r.date] !== undefined) {
                    dayMap[r.date] += (parseFloat(r.hours) || 0);
                }
            });

            const labels = allDays.map(d => d.slice(5));
            const values = allDays.map(d => dayMap[d] || 0);

            if (statsChartBar) {
                statsChartBar.destroy();
            }

            statsChartBar = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '工时 (h)',
                        data: values,
                        backgroundColor: '#6366f1',
                        borderColor: '#4f46e5',
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false,
                        },
                        tooltip: {
                            callbacks: {
                                title: function(items) {
                                    const idx = items[0].dataIndex;
                                    return allDays[idx] || '';
                                },
                                label: function(context) {
                                    return `${context.parsed.y.toFixed(2)}h`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: { size: 10 },
                                callback: function(value) { return value.toFixed(1) + 'h'; }
                            }
                        },
                        x: {
                            ticks: {
                                font: { size: 9 },
                                maxRotation: 30,
                                autoSkip: true,
                                maxTicksLimit: 15,
                            }
                        }
                    }
                }
            });
        }

        // ============================================================
        //  导入 / 导出
        // ============================================================
        function exportJSON() {
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `worktracker_${todayStr()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 JSON 已导出');
        }

        function exportCSV() {
            const headers = ['日期', '类型', '事件', '细节', '耗时(小时)'];
            const rows = data.records.map(r => [
                r.date,
                r.type,
                `"${r.event.replace(/"/g, '""')}"`,
                `"${(r.detail || '').replace(/"/g, '""')}"`,
                (parseFloat(r.hours) || 0).toFixed(2)
            ]);
            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `worktracker_${todayStr()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 CSV 已导出');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.records || !imported.todos || !imported.cycles) {
                        showToast('❌ 无效的数据文件');
                        return;
                    }
                    if (!confirm('导入将覆盖当前所有数据，确认继续？')) return;
                    data = imported;
                    if (!data.types) data.types = ['cgl', 'wjx', '三启', '证照', '其他'];
                    if (!data.doneTodos) data.doneTodos = [];
                    if (!data.specialDates) data.specialDates = [];
                    if (!data.timers) data.timers = {};
                    if (!data.nextId) data.nextId = 1;
                    if (data.notes === undefined) data.notes = '';
                    data.records.forEach(r => { if (!r.id) r.id = 'r' + Date.now() + '_' + Math.random().toString(36)
                            .slice(2, 6); });
                    data.todos.forEach(t => { if (!t.source) t.source = 'manual'; });
                    saveData();
                    showToast('✅ 数据导入成功');
                    document.getElementById('importFile').value = '';
                } catch (err) {
                    showToast('❌ 文件解析失败');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

            el._timer = setTimeout(() => el.classList.remove('show'), 2500);

            generateTodosFromCycles(true);

            const filterType = document.getElementById('filterType');

            getTypeOptions().forEach(t => {
                const opt = document.createElement('option');

                opt.textContent = t;
                filterType.appendChild(opt);
            });

                el.addEventListener('input', applyFilters);
                el.addEventListener('change', applyFilters);
            });

            const today = todayStr();
            document.getElementById('filterDateStart').value = today;
            document.getElementById('filterDateEnd').value = today;

            const cycleFirstDate = document.getElementById('cycleFirstDate');
            if (cycleFirstDate) cycleFirstDate.value = today;

            const notesEl = document.getElementById('notesEditor');
            if (notesEl) {
                notesEl.addEventListener('input', saveNotes);
                notesEl.addEventListener('blur', saveNotes);
            }

            switchPage('todo');
            renderStats();

        async function bootstrap() {
            setStatus('⏳ 同步中...');
            const cloud = await fetchCloudData();
            if (cloud && cloud.records) {
                data = cloud;
